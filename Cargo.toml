[package]
name = "handy-cli"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to transcribe audio files using Handy's local model."
license = "MIT"

[dependencies]
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", features = ["onnx"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dotenv = "0.15"
